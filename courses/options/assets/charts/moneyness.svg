<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Moneyness 區帶圖:買權在股價高於履約價時為價內,賣權相反,履約價附近為價平" font-family="system-ui, -apple-system, sans-serif"><defs><marker id="aI" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b949e"/></marker><marker id="aG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2ea043"/></marker><marker id="aR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f85149"/></marker></defs><text x="320" y="24" font-size="16" fill="#8b949e" text-anchor="middle" font-weight="600">價內 / 價平 / 價外(Moneyness)</text><text x="320" y="42" font-size="12" fill="#8b949e" text-anchor="middle">價內=履約對你有利:買權要股價&gt;K,賣權要股價&lt;K;價平時間價值最大</text><rect x="80" y="92" width="245" height="58" fill="rgba(139,148,158,.14)"/><rect x="355" y="92" width="245" height="58" fill="rgba(46,160,67,.22)"/><rect x="325" y="92" width="30" height="58" fill="rgba(210,153,34,.20)"/><text x="205" y="126" font-size="15" fill="#8b949e" text-anchor="middle" font-weight="600">價外 OTM</text><text x="475" y="126" font-size="15" fill="#2ea043" text-anchor="middle" font-weight="600">價內 ITM</text><text x="72" y="126" font-size="14" fill="#8b949e" text-anchor="end">買權 Call</text><rect x="80" y="202" width="245" height="58" fill="rgba(46,160,67,.22)"/><rect x="355" y="202" width="245" height="58" fill="rgba(139,148,158,.14)"/><rect x="325" y="202" width="30" height="58" fill="rgba(210,153,34,.20)"/><text x="205" y="236" font-size="15" fill="#2ea043" text-anchor="middle" font-weight="600">價內 ITM</text><text x="475" y="236" font-size="15" fill="#8b949e" text-anchor="middle" font-weight="600">價外 OTM</text><text x="72" y="236" font-size="14" fill="#8b949e" text-anchor="end">賣權 Put</text><line x1="340" y1="70" x2="340" y2="286" stroke="#8b949e" stroke-width="1" stroke-dasharray="4 4"/><text x="340" y="66" font-size="13" fill="#8b949e" text-anchor="middle">K(履約價)</text><text x="340" y="182" font-size="14" fill="#d29922" text-anchor="middle" font-weight="600">價平 ATM</text><line x1="80" y1="300" x2="600" y2="300" stroke="#8b949e" stroke-width="1.2" marker-end="url(#aI)"/><text x="84" y="318" font-size="12" fill="#8b949e" text-anchor="start">股價低</text><text x="596" y="318" font-size="12" fill="#8b949e" text-anchor="end">股價高</text><text x="320" y="352" font-size="12" fill="#8b949e" text-anchor="middle">同一個 K:對買權是價外時,對賣權就是價內(方向相反)</text></svg>