<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="兩位 KOL 框架對比:左為集中持股加 CC,右為指數底倉加 CSP,底部三條共同紀律" font-family="system-ui, -apple-system, sans-serif"><defs><marker id="aI" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b949e"/></marker><marker id="aG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2ea043"/></marker><marker id="aR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f85149"/></marker></defs><text x="320" y="24" font-size="16" fill="#8b949e" text-anchor="middle" font-weight="600">兩種賣方框架:集中持股+CC vs 指數底倉+CSP</text><rect x="36" y="44" width="278" height="248" rx="10" fill="none" stroke="#8b949e" stroke-width="1.5"/><text x="175" y="74" font-size="15" fill="#8b949e" text-anchor="middle" font-weight="600">Gozilla:集中持股 + CC</text><line x1="58" y1="88" x2="292" y2="88" stroke="#8b949e" stroke-width="1" opacity=".5"/><text x="58" y="116" font-size="13" fill="#8b949e" text-anchor="start">・持股集中:NVDA / PLTR / MU</text><text x="58" y="150" font-size="13" fill="#8b949e" text-anchor="start">・賣 CC 收現金流當生活費</text><text x="58" y="184" font-size="13" fill="#8b949e" text-anchor="start">・delta 0.25–0.3,短天期</text><text x="58" y="218" font-size="13" fill="#8b949e" text-anchor="start">・只賣 50–80% 持股水位</text><text x="58" y="252" font-size="13" fill="#8b949e" text-anchor="start">・被突破 → 結算日尾盤 roll</text><rect x="326" y="44" width="278" height="248" rx="10" fill="none" stroke="#8b949e" stroke-width="1.5"/><text x="465" y="74" font-size="15" fill="#8b949e" text-anchor="middle" font-weight="600">Led:指數底倉 + CSP</text><line x1="348" y1="88" x2="582" y2="88" stroke="#8b949e" stroke-width="1" opacity=".5"/><text x="348" y="116" font-size="13" fill="#8b949e" text-anchor="start">・底倉 0050 / VOO / QQQ 持續買</text><text x="348" y="150" font-size="13" fill="#8b949e" text-anchor="start">・回檔開倉 sell put,反彈平倉</text><text x="348" y="184" font-size="13" fill="#8b949e" text-anchor="start">・想接→短天期;搶反彈→長天期</text><text x="348" y="218" font-size="13" fill="#8b949e" text-anchor="start">・CC 撞履約價就換股,不 roll</text><text x="348" y="252" font-size="13" fill="#8b949e" text-anchor="start">・接刀表:預先寫好的加碼階梯</text><rect x="36" y="306" width="568" height="52" rx="10" fill="rgba(139,148,158,.14)" stroke="#8b949e" stroke-width="1" stroke-dasharray="4 4"/><text x="66" y="337" font-size="14" fill="#8b949e" text-anchor="start" font-weight="600">共同紀律</text><rect x="182" y="316" width="96" height="32" rx="16" fill="rgba(46,160,67,.22)" stroke="#2ea043" stroke-width="1.5"/><text x="230" y="337" font-size="14" fill="#2ea043" text-anchor="middle" font-weight="600">不裸賣</text><rect x="302" y="316" width="96" height="32" rx="16" fill="rgba(46,160,67,.22)" stroke="#2ea043" stroke-width="1.5"/><text x="350" y="337" font-size="14" fill="#2ea043" text-anchor="middle" font-weight="600">不下滿</text><rect x="426" y="316" width="120" height="32" rx="16" fill="rgba(46,160,67,.22)" stroke="#2ea043" stroke-width="1.5"/><text x="486" y="337" font-size="14" fill="#2ea043" text-anchor="middle" font-weight="600">小賺平倉</text><text x="320" y="382" font-size="12" fill="#8b949e" text-anchor="middle">依 Threads 公開貼文歸納(2026-05〜08);收入數字為本人自述,未經驗證</text></svg>