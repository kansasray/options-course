<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Wheel 循環圖:賣現金擔保賣權,被指派接股後改賣掩護性買權,被履約交股後回到起點" font-family="system-ui, -apple-system, sans-serif"><defs><marker id="aI" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b949e"/></marker><marker id="aG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2ea043"/></marker><marker id="aR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f85149"/></marker></defs><text x="320" y="24" font-size="16" fill="#8b949e" text-anchor="middle" font-weight="600">Wheel:CSP 與 CC 的循環</text><rect x="192" y="58" width="256" height="40" rx="9" fill="none" stroke="#8b949e" stroke-width="1.5"/><text x="320" y="82.9" font-size="14" fill="#8b949e" text-anchor="middle" font-weight="600">① 賣 CSP(現金擔保賣權)</text><rect x="424" y="178" width="176" height="44" rx="9" fill="none" stroke="#8b949e" stroke-width="1.5"/><text x="512" y="196.4" font-size="14" fill="#8b949e" text-anchor="middle" font-weight="600">② 被指派:接股</text><text x="512" y="212.3" font-size="11" fill="#8b949e" text-anchor="middle">(用兩平價買進)</text><rect x="192" y="302" width="256" height="40" rx="9" fill="none" stroke="#8b949e" stroke-width="1.5"/><text x="320" y="326.9" font-size="14" fill="#8b949e" text-anchor="middle" font-weight="600">③ 賣 CC(掩護性買權)</text><rect x="40" y="178" width="176" height="44" rx="9" fill="none" stroke="#8b949e" stroke-width="1.5"/><text x="128" y="196.4" font-size="14" fill="#8b949e" text-anchor="middle" font-weight="600">④ 被 call 走:交股</text><text x="128" y="212.3" font-size="11" fill="#8b949e" text-anchor="middle">(獲利了結出場)</text><path d="M452 96 Q520 122 516 174" fill="none" stroke="#8b949e" stroke-width="1.5" marker-end="url(#aI)"/><path d="M508 226 Q500 280 452 306" fill="none" stroke="#8b949e" stroke-width="1.5" marker-end="url(#aI)"/><path d="M188 306 Q140 280 132 226" fill="none" stroke="#8b949e" stroke-width="1.5" marker-end="url(#aI)"/><path d="M124 174 Q128 122 188 98" fill="none" stroke="#8b949e" stroke-width="1.5" marker-end="url(#aI)"/><text x="320" y="190" font-size="18" fill="#8b949e" text-anchor="middle" font-weight="600">Wheel</text><text x="320" y="210" font-size="12" fill="#8b949e" text-anchor="middle">循環的每一步</text><text x="320" y="226" font-size="12" fill="#8b949e" text-anchor="middle">都在收權利金</text><text x="320" y="116" font-size="12" fill="#2ea043" text-anchor="middle">未被指派 → 權利金落袋,重複賣 CSP</text><text x="320" y="288" font-size="12" fill="#2ea043" text-anchor="middle">未被 call 走 → 權利金落袋,續賣 CC</text><text x="320" y="366" font-size="12" fill="#8b949e" text-anchor="middle">Led 對 SPCX 的 CSP+CC 降成本操作,行為上近似 wheel(課程詮釋,非本人用語)</text></svg>