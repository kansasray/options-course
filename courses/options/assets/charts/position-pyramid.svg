<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="倉位金字塔:底層指數底倉最大,中層個股持股,頂層選擇權收租部位最小" font-family="system-ui, -apple-system, sans-serif"><defs><marker id="aI" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b949e"/></marker><marker id="aG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2ea043"/></marker><marker id="aR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f85149"/></marker></defs><text x="320" y="24" font-size="16" fill="#8b949e" text-anchor="middle" font-weight="600">倉位金字塔:選擇權是附屬,不是本體</text><polygon points="262,64 318,64 384,148 196,148" fill="rgba(210,153,34,.20)" stroke="#d29922" stroke-width="1.5"/><polygon points="191,154 389,154 455,240 125,240" fill="rgba(139,148,158,.14)" stroke="#8b949e" stroke-width="1.5"/><polygon points="120,246 460,246 535,344 45,344" fill="rgba(46,160,67,.22)" stroke="#2ea043" stroke-width="1.5"/><text x="290" y="112" font-size="14" fill="#d29922" text-anchor="middle" font-weight="600">選擇權</text><text x="290" y="132" font-size="12" fill="#d29922" text-anchor="middle">CC / CSP 收租</text><text x="290" y="188" font-size="15" fill="#8b949e" text-anchor="middle" font-weight="600">個股持股</text><text x="290" y="208" font-size="12" fill="#8b949e" text-anchor="middle">集中(Gozilla)或衛星(Led)</text><text x="290" y="226" font-size="12" fill="#8b949e" text-anchor="middle">控制比例、看得懂才買</text><text x="290" y="288" font-size="15" fill="#2ea043" text-anchor="middle" font-weight="600">指數底倉</text><text x="290" y="308" font-size="12" fill="#2ea043" text-anchor="middle">0050 / VOO / QQQ / SMH</text><text x="290" y="326" font-size="12" fill="#2ea043" text-anchor="middle">持續買進、長期持有</text><text x="548" y="108" font-size="12" fill="#8b949e" text-anchor="start">小部位收租</text><text x="548" y="198" font-size="12" fill="#8b949e" text-anchor="start">中部位精選</text><text x="548" y="296" font-size="12" fill="#8b949e" text-anchor="start">大部位長抱</text><text x="320" y="376" font-size="12" fill="#8b949e" text-anchor="middle">附屬收入疊在穩固底倉上:先有底倉與持股,才有 CC / CSP 可賣</text></svg>