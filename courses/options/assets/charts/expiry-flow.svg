<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="到期流程圖:到期日依是否價內分岔,價內自動履約轉股票,價外權利金歸零" font-family="system-ui, -apple-system, sans-serif"><defs><marker id="aI" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b949e"/></marker><marker id="aG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2ea043"/></marker><marker id="aR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f85149"/></marker></defs><text x="320" y="24" font-size="16" fill="#8b949e" text-anchor="middle" font-weight="600">到期結算:價內自動履約,價外歸零</text><rect x="235" y="46" width="170" height="36" rx="9" fill="none" stroke="#8b949e" stroke-width="1.5"/><text x="320" y="68.9" font-size="14" fill="#8b949e" text-anchor="middle" font-weight="600">到期日收盤</text><line x1="320" y1="82" x2="320" y2="112" stroke="#8b949e" stroke-width="1.5" marker-end="url(#aI)"/><polygon points="320,114 412,152 320,190 228,152" fill="none" stroke="#8b949e" stroke-width="1.5"/><text x="320" y="149" font-size="14" fill="#8b949e" text-anchor="middle" font-weight="600">是否價內?</text><text x="320" y="168" font-size="11" fill="#8b949e" text-anchor="middle">(股價 vs 履約價 K)</text><line x1="262" y1="176" x2="176" y2="226" stroke="#8b949e" stroke-width="1.5" marker-end="url(#aI)"/><text x="183" y="197" font-size="12" fill="#2ea043" text-anchor="middle">是(ITM)</text><line x1="378" y1="176" x2="464" y2="226" stroke="#8b949e" stroke-width="1.5" marker-end="url(#aI)"/><text x="461" y="197" font-size="12" fill="#f85149" text-anchor="middle">否(OTM)</text><rect x="42" y="230" width="236" height="76" rx="9" fill="rgba(46,160,67,.22)" stroke="#2ea043" stroke-width="1.5"/><text x="160" y="253.9" font-size="14" fill="#2ea043" text-anchor="middle" font-weight="600">自動履約(轉股票部位)</text><text x="160" y="272.2" font-size="12" fill="#8b949e" text-anchor="middle">買權:以 K 買進股票</text><text x="160" y="291.2" font-size="12" fill="#8b949e" text-anchor="middle">賣權:以 K 賣出股票</text><rect x="362" y="230" width="236" height="76" rx="9" fill="rgba(248,81,73,.20)" stroke="#f85149" stroke-width="1.5"/><text x="480" y="253.9" font-size="14" fill="#f85149" text-anchor="middle" font-weight="600">權利金歸零</text><text x="480" y="272.2" font-size="12" fill="#8b949e" text-anchor="middle">買方:損失全部權利金</text><text x="480" y="291.2" font-size="12" fill="#8b949e" text-anchor="middle">賣方:權利金全數落袋</text><text x="320" y="340" font-size="12" fill="#8b949e" text-anchor="middle">美股規則:到期時價內 $0.01 即自動履約</text><text x="320" y="358" font-size="12" fill="#8b949e" text-anchor="middle">不想接股 / 交股,可在到期前先平倉</text></svg>