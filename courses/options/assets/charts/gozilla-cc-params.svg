2="115" stroke="#8b949e" stroke-width="1.2"/><text x="596" y="129" font-size="11" fill="#8b949e" text-anchor="middle">0.5</text><rect x="373" y="100" width="44.6" height="20" fill="rgba(46,160,67,.22)" stroke="#2ea043" stroke-width="1.5" rx="3"/><text x="395.3" y="93" font-size="14" fill="#2ea043" text-anchor="middle" font-weight="600">常用 0.25–0.3</text><line x1="506.8" y1="88" x2="506.8" y2="118" stroke="#f85149" stroke-width="1.5" stroke-dasharray="4 4"/><text x="506.8" y="82" font-size="13" fill="#f85149" text-anchor="middle" font-weight="600">上限 0.4</text><text x="130" y="209" font-size="14" fill="#8b949e" text-anchor="end" font-weight="600">持股水位</text><line x1="150" y1="205" x2="596" y2="205" stroke="#8b949e" stroke-width="1.2"/><line x1="150" y1="205" x2="150" y2="210" stroke="#8b949e" stroke-width="1.2"/><text x="150" y="224" font-size="11" fill="#8b949e" text-anchor="middle">0%</text><line x1="261.5" y1="205" x2="261.5" y2="210" stroke="#8b949e" stroke-width="1.2"/><text x="261.5" y="224" font-size="11" fill="#8b949e" text-anchor="middle">25%</text><line x1="373" y1="205" x2="373" y2="210" stroke="#8b949e" stroke-width="1.2"/><text x="373" y="224" font-size="11" fill="#8b949e" text-anchor="middle">50%</text><line x1="484.5" y1="205" x2="484.5" y2="210" stroke="#8b949e" stroke-width="1.2"/><text x="484.5" y="224" font-size="11" fill="#8b949e" text-anchor="middle">75%</text><line x1="596" y1="205" x2="596" y2="210" stroke="#8b949e" stroke-width="1.2"/><text x="596" y="224" font-size="11" fill="#8b949e" text-anchor="middle">100%</text><rect x="373" y="195" width="133.8" height="20" fill="rgba(46,160,67,.22)" stroke="#2ea043" stroke-width="1.5" rx="3"/><text x="439.9" y="188" font-size="14" fill="#2ea043" text-anchor="middle" font-weight="600">只賣 50–80%</text><line x1="596" y1="183" x2="596" y2="213" stroke="#f85149" stroke-width="1.5" stroke-dasharray="4 4"/><text x="596" y="177" font-size="13" fill="#f85149" text-anchor="middle" font-weight="600">不下滿</text><text x="150" y="245" font-size="12" fill="#8b949e" text-anchor="start">「假如你有 1 萬股,不要賣 100 口 CC,賣 50–80 口就可以」</text><text x="130" y="304" font-size="14" fill="#8b949e" text-anchor="end" font-weight="600">到期天期</text><line x1="150" y1="300" x2="596" y2="300" stroke="#8b949e" stroke-width="1.2"/><line x1="150" y1="300" x2="150" y2="305" stroke="#8b949e" stroke-width="1.2"/><text x="150" y="319" font-size="11" fill="#8b949e" text-anchor="middle">0天</text><line x1="254.1" y1="300" x2="254.1" y2="305" stroke="#8b949e" stroke-width="1.2"/><text x="254.1" y="319" font-size="11" fill="#8b949e" text-anchor="middle">7天</text><line x1="358.1" y1="300" x2="358.1" y2="305" stroke="#8b949e" stroke-width="1.2"/><text x="358.1" y="319" font-size="11" fill="#8b949e" text-anchor="middle">14天</text><line x1="462.2" y1="300" x2="462.2" y2="305" stroke="#8b949e" stroke-width="1.2"/><text x="462.2" y="319" font-size="11" fill="#8b949e" text-anchor="middle">21天</text><line x1="596" y1="300" x2="596" y2="305" stroke="#8b949e" stroke-width="1.2"/><text x="596" y="319" font-size="11" fill="#8b949e" text-anchor="middle">30天</text><rect x="150" y="290" width="104.1" height="20" fill="rgba(46,160,67,.22)" stroke="#2ea043" stroke-width="1.5" rx="3"/><text x="202" y="283" font-size="14" fill="#2ea043" text-anchor="middle" font-weight="600">短天期(當週)</text><text x="150" y="340" font-size="12" fill="#8b949e" text-anchor="start">挑每週一/三/五結算的合約;被突破時在結算日尾盤往後 roll</text><text x="320" y="378" font-size="12" fill="#8b949e" text-anchor="middle">共同前提:不貪心下滿,權利金「繳稅後生活夠用就好」</text></svg>