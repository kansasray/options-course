<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Led 的 CSP 流程圖:回檔開倉賣現金擔保賣權,反彈小賺平倉,續跌被指派接股後轉做 CC 降成本" font-family="system-ui, -apple-system, sans-serif"><defs><marker id="aI" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b949e"/></marker><marker id="aG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2ea043"/></marker><marker id="aR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f85149"/></marker></defs><text x="320" y="24" font-size="16" fill="#8b949e" text-anchor="middle" font-weight="600">Led 的 CSP 操作流程</text><text x="320" y="42" font-size="12" fill="#8b949e" text-anchor="middle">來源:Threads @_lepetitdejeuner 貼文自述(2026-06〜08)</text><rect x="225" y="60" width="190" height="36" rx="9" fill="none" stroke="#8b949e" stroke-width="1.5"/><text x="320" y="82.9" font-size="14" fill="#8b949e" text-anchor="middle" font-weight="600">標的明顯回檔</text><line x1="320" y1="96" x2="320" y2="126" stroke="#8b949e" stroke-width="1.5" marker-end="url(#aI)"/><rect x="188" y="129" width="264" height="38" rx="9" fill="none" stroke="#8b949e" stroke-width="1.5"/><text x="320" y="152.9" font-size="14" fill="#8b949e" text-anchor="middle" font-weight="600">開倉 sell put(cash-secured)</text><line x1="250" y1="167" x2="168" y2="212" stroke="#8b949e" stroke-width="1.5" marker-end="url(#aI)"/><text x="179" y="187.5" font-size="12" fill="#2ea043" text-anchor="middle">反彈</text><line x1="390" y1="167" x2="472" y2="212" stroke="#8b949e" stroke-width="1.5" marker-end="url(#aI)"/><text x="463" y="187.5" font-size="12" fill="#f85149" text-anchor="middle">續跌</text><rect x="34" y="216" width="252" height="72" rx="9" fill="rgba(46,160,67,.22)" stroke="#2ea043" stroke-width="1.5"/><text x="160" y="237.9" font-size="14" fill="#2ea043" text-anchor="middle" font-weight="600">權利金小賺 → 平倉</text><text x="160" y="256.2" font-size="12" fill="#8b949e" text-anchor="middle">開倉即掛平倉單,小賺就跑</text><text x="160" y="275.2" font-size="12" fill="#8b949e" text-anchor="middle">→ 等下一次回檔再開倉</text><rect x="354" y="216" width="252" height="72" rx="9" fill="none" stroke="#8b949e" stroke-width="1.5"/><text x="480" y="237.9" font-size="14" fill="#8b949e" text-anchor="middle" font-weight="600">跌破履約價 → 被指派接股</text><text x="480" y="256.2" font-size="12" fill="#8b949e" text-anchor="middle">用兩平成本買進正股</text><text x="480" y="275.2" font-size="12" fill="#8b949e" text-anchor="middle">→ 轉做 CC / CSP 降低持股成本</text><rect x="60" y="308" width="520" height="46" rx="9" fill="rgba(139,148,158,.14)" stroke="#8b949e" stroke-width="1" stroke-dasharray="4 4"/><text x="320" y="328" font-size="13" fill="#8b949e" text-anchor="middle" font-weight="600">天期分工:真正想接的股票 → 短天期;搶反彈賺權利金 → 長天期</text><text x="320" y="346" font-size="12" fill="#8b949e" text-anchor="middle">紀律:一定 cash-secured 不做裸賣;小賺就平倉,不貪</text><text x="320" y="378" font-size="12" fill="#8b949e" text-anchor="middle">例:GOOGL sell put 履約價 310/315、兩週到期,目標接 200 股</text></svg>